name: macOS Intel x86_64

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15-intel

    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd, ldc]

    steps:
      - uses: actions/checkout@v4

      - name: Set up D compiler
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ${{ matrix.compiler }}-latest

      - name: Verify compiler version
        run: |
          if [ "${{ matrix.compiler }}" = "dmd" ]; then
            dmd --version
          else
            ldc2 --version
          fi

      - name: Run tests
        run: |
          dub test -ax86_64 --parallel -b=unittest-cov
